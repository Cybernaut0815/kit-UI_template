name: release
on:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changesets/action needs full history to detect changes + push the version commit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mirror each package to a flat release/<pkg> branch + <pkg>-v<version> tag so
      # consumers can install via `github:GitZHACODE/zha-ui#release/<pkg>` with no PAT
      # (see README). Ungated on purpose: the script skips versions whose tag already
      # exists, so this is a no-op on ordinary pushes, self-heals after a failed run,
      # and never force-moves a published tag.
      - run: node scripts/publish-branches.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
