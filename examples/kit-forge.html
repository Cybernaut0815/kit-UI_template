<!doctype html>
<html lang="en" data-kit="forge" data-density="compact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIT-FORGE test page</title>
  <link rel="stylesheet" href="../css/kit-ui.css">
</head>
<!-- Generation tool: parameters left, the generated layout in the viewport, variants right. Every control regenerates live. -->
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell" style="--sidebar-w: 0px">
    <header class="app-bar">
      <a class="app-bar__brand" href="./index.html"><span class="kit-mark">kit-<span class="kit-mark__name">forge</span></span><span class="app-bar__app">Parcels</span></a>
      <span class="app-bar__spacer"></span>
      <a class="btn btn--ghost" href="./kit-sim.html">Sim</a>
      <a class="btn btn--ghost" href="./kit-viz.html">Viz</a>
      <button class="icon-btn icon-btn--ghost" type="button" aria-label="Switch light and dark theme" id="theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="M12 4v16h8V4Z" fill="currentColor"/></svg>
      </button>
    </header>

    <main class="app-main" id="main">
      <h1 class="sr-only">Parcel generator</h1>
      <div class="split split--fill" style="--split-aside: 20rem">
        <div class="split split--aside-start split--fill" style="--split-aside: 24rem">
          <aside class="panel stack" aria-label="Parameters">
            <h2>Parameters</h2>
            <div class="field">
              <label class="field__label" for="outline">Outline</label>
              <select class="select" id="outline"><option>Block 4, north</option><option>Block 7, riverside</option></select>
            </div>
            <fieldset class="field">
              <legend>Split</legend>
              <div class="segmented" role="radiogroup" aria-label="Split rule">
                <label><input type="radio" name="rule" value="long" checked> Longest edge</label>
                <label><input type="radio" name="rule" value="alt"> Alternating</label>
              </div>
            </fieldset>
            <div class="slider-row"><label for="min">Min parcel</label><input id="min" type="range" min="400" max="4000" step="100" value="1400"><output class="slider-row__value" id="min-out"></output></div>
            <div class="slider-row"><label for="street">Street</label><input id="street" type="range" min="2" max="14" value="6"><output class="slider-row__value" id="street-out"></output></div>
            <div class="slider-row"><label for="depth">Depth</label><input id="depth" type="range" min="1" max="7" value="5"><output class="slider-row__value" id="depth-out"></output></div>
            <div class="toolbar">
              <div class="field"><label class="sr-only" for="seed">Seed</label><input class="input" id="seed" type="number" value="4" min="1" placeholder="Seed"></div>
              <button class="btn btn--secondary" type="button" id="shuffle">Shuffle seed</button>
            </div>
            <label><input type="checkbox" id="parks" checked> Keep one park per block</label>
            <div class="cluster">
              <span class="chip chip--red">Residential</span>
              <span class="chip chip--blue">Mixed use</span>
              <span class="chip chip--green">Park</span>
              <span class="chip chip--amber">Civic</span>
            </div>
          </aside>

          <div class="viewport">
            <svg id="plan" viewBox="0 0 400 300" role="img" aria-label="Generated parcels inside the block outline"></svg>
            <div class="viewport__info"><span id="info"></span><span>Top view · 1 : 1000</span></div>
            <div class="viewport__bar cluster cluster--between">
              <div class="cluster"><button class="btn btn--secondary" type="button">Export USD</button></div>
              <div class="cluster"><span class="text-muted" id="took"></span><button class="btn btn--primary" type="button" id="generate">Generate</button></div>
            </div>
          </div>
        </div>

        <aside class="panel stack" aria-label="Variants">
          <h2>Variants</h2>
          <div class="grid" style="--grid-min: 8rem" id="variants"></div>
          <div class="grid" style="--grid-min: 6rem">
            <div class="stat"><span class="stat__label">Parcels</span><span class="stat__value" id="count">-</span></div>
            <div class="stat"><span class="stat__label">Mean area</span><span class="stat__value" id="mean">-</span><span class="stat__delta">m²</span></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th scope="col">Use</th><th scope="col" class="num">Parcels</th></tr></thead>
              <tbody id="uses"></tbody>
            </table>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    var html = document.documentElement, NS = 'http://www.w3.org/2000/svg';
    var $ = function (id) { return document.getElementById(id); };
    function el(parent, tag, attrs, style) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      for (var s in style || {}) e.style[s] = style[s];
      return parent.appendChild(e);
    }
    $('theme').onclick = function () {
      var dark = (html.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'dark';
      html.dataset.theme = dark ? 'light' : 'dark';
    };

    // land uses -> chip hues, so the plan and the legend chips agree in every theme
    var USES = [['Residential', 'red'], ['Mixed use', 'blue'], ['Park', 'green'], ['Civic', 'amber']];
    var BASE = { red: '--color-red-500', blue: '--color-blue', green: '--color-green', amber: '--color-amber' };
    function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }

    // recursive split of the block: cut across the longer (or alternating) side, leave a street in the cut
    function generate(seed, opts) {
      var rand = rng(seed * 7919), parcels = [];
      (function split(r, depth, vertical) {
        var cutV = opts.rule === 'alt' ? vertical : r.w > r.h;
        if (depth === 0 || r.w * r.h * 2.5 < opts.min * 2 || (depth < opts.depth - 1 && rand() < 0.15)) return parcels.push(r);
        var t = 0.35 + rand() * 0.3, s = opts.street / (depth > opts.depth - 2 ? 1 : 2);
        if (cutV) { var a = r.w * t; split({ x: r.x, y: r.y, w: a - s / 2, h: r.h }, depth - 1, !vertical); split({ x: r.x + a + s / 2, y: r.y, w: r.w - a - s / 2, h: r.h }, depth - 1, !vertical); }
        else { var b = r.h * t; split({ x: r.x, y: r.y, w: r.w, h: b - s / 2 }, depth - 1, !vertical); split({ x: r.x, y: r.y + b + s / 2, w: r.w, h: r.h - b - s / 2 }, depth - 1, !vertical); }
      })({ x: 20, y: 20, w: 360, h: 260 }, opts.depth, true);
      parcels.forEach(function (p) { p.use = rand() < 0.62 ? 0 : rand() < 0.6 ? 1 : 3; });
      if (opts.parks) parcels.reduce(function (a, b) { return a.w * a.h > b.w * b.h ? a : b; }).use = 2;
      return parcels;
    }
    function draw(svg, parcels, thumb) {
      svg.textContent = '';
      el(svg, 'rect', { x: 14, y: 14, width: 372, height: 272 }, { fill: 'none', stroke: 'var(--accent)', strokeWidth: thumb ? 3 : 1.5 });
      parcels.forEach(function (p) {
        var hue = USES[p.use][1];
        el(svg, 'rect', { x: p.x, y: p.y, width: Math.max(p.w, 0), height: Math.max(p.h, 0) },
          { fill: 'color-mix(in srgb, var(' + BASE[hue] + ') 30%, transparent)', stroke: 'var(--chip-' + hue + '-text)', strokeWidth: thumb ? 2 : 1 });
      });
    }
    function opts() {
      return { rule: document.querySelector('[name=rule]:checked').value, min: +$('min').value, street: +$('street').value, depth: +$('depth').value, parks: $('parks').checked };
    }
    function update() {
      var o = opts(), seed = +$('seed').value || 1, t0 = performance.now(), parcels = generate(seed, o);
      draw($('plan'), parcels);
      $('min-out').textContent = o.min + ' m²'; $('street-out').textContent = o.street + ' m'; $('depth-out').textContent = o.depth;
      $('count').textContent = parcels.length;
      $('mean').textContent = Math.round(parcels.reduce(function (s, p) { return s + p.w * p.h * 2.5; }, 0) / parcels.length).toLocaleString('en');
      $('info').textContent = parcels.length + ' parcels · seed ' + seed;
      $('took').textContent = (performance.now() - t0).toFixed(1) + ' ms';
      $('uses').innerHTML = USES.map(function (u, i) {
        return '<tr><td><span class="chip chip--' + u[1] + '">' + u[0] + '</span></td><td class="num">' + parcels.filter(function (p) { return p.use === i; }).length + '</td></tr>';
      }).join('');
      // four neighbouring seeds as variants; the current one carries the accent stripe
      $('variants').innerHTML = '';
      [seed, seed + 1, seed + 2, seed + 3].forEach(function (s) {
        var card = document.createElement('button');
        card.type = 'button'; card.className = 'card card--interactive card--flush' + (s === seed ? ' card--accent' : '');
        card.setAttribute('aria-label', 'Variant seed ' + s);
        card.onclick = function () { $('seed').value = s; update(); };
        var svg = el(card, 'svg', { viewBox: '0 0 400 300', width: '100%' }, { display: 'block' });
        draw(svg, generate(s, o), true);
        $('variants').appendChild(card);
      });
    }
    document.addEventListener('input', update);
    $('shuffle').onclick = function () { $('seed').value = 1 + Math.floor(Math.random() * 999); update(); };
    $('generate').onclick = function () { $('seed').value = +$('seed').value + 4; update(); };
    update();
  </script>
</body>
</html>
